<meta name="theme-color" content="#FFF6F4">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="냠픽">

<title>냠픽 NyamPick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 손에 쥐는 단일 컬럼 앱. 블러시 핑크→라벤더 배경 위에 음식 스티커가 흩어져 있고, 카드는 둥글고 말랑하게 */
:root {
  --bg: #FFF6F4;
  --bg-2: #F5EEFB;
  --surface: #FFFFFF;
  --ink: #3B3040;
  --muted: #877A86;
  --line: #F0E1E7;
  --brand: #6E5A7E;          /* 이름·로고: 차분한 플럼 */
  --accent: #D9577A;         /* 주요 버튼: 로즈 */
  --on-accent: #FFFFFF;
  --accent-soft: #FDE4EB;
  --butter: #FFF0BF;
  --on-butter: #3B3040;
  --mint: #D6F1E6;
  --lilac: #ECE3FB;
  --peach: #FFE4D4;
  --sky: #DDEEFB;
  --display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1A23; --bg-2: #261F2D; --surface: #2B2431; --ink: #F4EDF3; --muted: #B6A8B4; --line: #3D3443;
    --brand: #D3C0E6; --accent: #F28AA3; --on-accent: #2A1019; --accent-soft: #46283A;
    --butter: #F3DE98; --on-butter: #2E2530; --mint: #2E4A40; --lilac: #3A3150; --peach: #4A3530; --sky: #2B3C4C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1A23; --bg-2: #261F2D; --surface: #2B2431; --ink: #F4EDF3; --muted: #B6A8B4; --line: #3D3443;
  --brand: #D3C0E6; --accent: #F28AA3; --on-accent: #2A1019; --accent-soft: #46283A;
  --butter: #F3DE98; --on-butter: #2E2530; --mint: #2E4A40; --lilac: #3A3150; --peach: #4A3530; --sky: #2B3C4C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%) fixed, var(--bg);
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
  overflow-x: hidden;
}
.ic { width: 1em; height: 1em; display: block; flex: none; }

/* ── 스플래시 ───────────────────────── */
#splash {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: radial-gradient(120% 80% at 50% 40%, var(--accent-soft) 0%, var(--bg) 55%, var(--bg-2) 100%);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  transition: opacity .5s ease, visibility .5s;
}
#splash.hide { opacity: 0; visibility: hidden; }
.sp-ring { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
.sp-ring .ic { position: absolute; width: 58px; height: 58px; animation: pop .55s cubic-bezier(.2,1.6,.4,1) both; }
.sp-ring .ic:nth-child(1) { top: 2px;  left: 91px;  animation-delay: .05s; }
.sp-ring .ic:nth-child(2) { top: 44px; left: 172px; animation-delay: .15s; }
.sp-ring .ic:nth-child(3) { top: 136px; left: 172px; animation-delay: .25s; }
.sp-ring .ic:nth-child(4) { top: 178px; left: 91px; animation-delay: .35s; }
.sp-ring .ic:nth-child(5) { top: 136px; left: 10px; animation-delay: .45s; }
.sp-ring .ic:nth-child(6) { top: 44px; left: 10px;  animation-delay: .55s; }
.sp-logo { font-family: var(--display); font-size: 64px; line-height: 1; color: var(--brand); animation: rise .7s .2s cubic-bezier(.2,1.4,.4,1) both; }
.sp-tag { color: var(--muted); font-size: 15px; letter-spacing: .04em; animation: rise .7s .35s ease both; }
.sp-dots { display: flex; gap: 6px; margin-top: 18px; }
.sp-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
.sp-dots i:nth-child(2) { animation-delay: .15s; } .sp-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

/* ── 배경 스티커 ─────────────────────── */
#decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#decor .ic { position: absolute; width: 64px; height: 64px; opacity: .16; }
@media (min-width: 700px) { #decor .ic { opacity: .22; width: 84px; height: 84px; } }

/* ── 배경음악 버튼 ───────────────────── */
#bgm {
  position: fixed; z-index: 20;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px));
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--brand);
  display: grid; place-items: center; cursor: pointer; font-size: 20px;
  box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--brand) 40%, transparent);
}
#bgm[aria-pressed="false"] { color: var(--muted); }
#bgm[aria-pressed="false"] .wave { display: none; }
#bgm[aria-pressed="true"] .ic { animation: sway 1.6s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* ── 앱 ──────────────────────────────── */
.app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-right: 56px; min-height: 44px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; color: var(--brand); }
.brand span { font-size: 13px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: 29px; line-height: 1.25; margin: 0; text-wrap: balance; word-break: keep-all; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 0; }
p { margin: 0; }
.lead { color: var(--muted); word-break: keep-all; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
input[type=text] {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
}
input[type=text]:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }
.btn {
  border: 0; border-radius: 18px; padding: 15px 18px; font-family: var(--display); font-size: 19px;
  background: var(--accent); color: var(--on-accent); width: 100%;
  box-shadow: 0 10px 22px -12px var(--accent);
  transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; font-family: var(--body); font-size: 14px; font-weight: 500; padding: 12px 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 14px; width: 44px; height: 44px; flex: none; font-size: 18px; }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px;
  padding: 10px 6px; font-size: 14px; font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--surface); border-color: var(--brand); }
.hint { font-size: 13px; color: var(--muted); word-break: keep-all; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip[aria-pressed="true"].no { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip[aria-pressed="true"].meh { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.chip:disabled { opacity: .35; cursor: not-allowed; }
.progress { display: flex; gap: 5px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.on { background: var(--accent); }

/* 메뉴판 인포그래픽 */
.menuboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.menuboard .mb:last-child:nth-child(odd) { grid-column: 1 / -1; }
.mb { border-radius: 18px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
.mb .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.mb .ic { width: 40px; height: 40px; }
.mb .cnt { font-family: var(--display); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.mb .cnt small { font-family: var(--body); font-size: 12px; color: var(--muted); margin-left: 2px; }
.mb .nm { font-size: 13px; font-weight: 700; }
.mb .meter { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
.mb .meter span { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
.c-한식 { background: var(--peach); } .c-중식 { background: var(--butter); } .c-일식 { background: var(--accent-soft); }
.c-양식 { background: var(--lilac); } .c-분식 { background: var(--accent-soft); } .c-아시안 { background: var(--mint); } .c-패스트푸드 { background: var(--sky); }
.mb.c-중식 { color: var(--on-butter); }

/* 핸드오프 */
.handoff { text-align: center; padding-block: 36px; gap: 14px; align-items: center; }
.handoff .ic { width: 84px; height: 84px; animation: bob 2.4s ease-in-out infinite; }
.handoff .who { font-family: var(--display); font-size: 50px; line-height: 1.1; color: var(--brand); word-break: keep-all; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* 월드컵 */
.wc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.wc-head .round { font-family: var(--display); font-size: 26px; color: var(--brand); }
.wc-head .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.duel { display: grid; gap: 10px; }
.pick {
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 26px;
  padding: 20px 18px; display: flex; align-items: center; gap: 14px; text-align: left;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.pick:hover { border-color: var(--accent); box-shadow: 0 12px 24px -16px var(--accent); }
.pick:active { transform: scale(.98); }
.pick .art { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; flex: none; }
.pick .art .ic { width: 56px; height: 56px; }
.pick .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pick .name { font-family: var(--display); font-size: 30px; line-height: 1.1; word-break: keep-all; }
.pick .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tag { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 1px 8px; }
.price { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vs { text-align: center; font-family: var(--display); color: var(--accent); font-size: 20px; letter-spacing: .1em; }

/* 결과 */
.ticket {
  background: var(--butter); color: var(--on-butter); border-radius: 28px; padding: 22px 20px 18px;
  display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
}
.ticket .badge { position: absolute; right: 14px; top: 14px; width: 92px; height: 92px; }
.ticket .no { font-size: 12px; letter-spacing: .12em; font-weight: 700; opacity: .7; }
.ticket .name { font-family: var(--display); font-size: 52px; line-height: 1.05; word-break: keep-all; padding-right: 96px; }
.ticket .reason { font-size: 14px; }
.ticket .foot { border-top: 2px dashed color-mix(in srgb, var(--on-butter) 30%, transparent); margin-top: 10px; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ticket .pts { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.ticket .foot a { color: var(--on-butter); font-weight: 700; font-size: 14px; }
.alt { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.alt:first-child { border-top: 0; padding-top: 0; }
.alt .top { display: flex; align-items: center; gap: 10px; }
.alt .top .ic { width: 34px; height: 34px; }
.alt .rank { color: var(--muted); font-size: 13px; }
.alt .name { font-family: var(--display); font-size: 24px; }
.alt .pts { margin-left: auto; font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font-size: 12px; }
.bars .n { color: inherit; max-width: 6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { display: block; height: 7px; border-radius: 4px; background: color-mix(in srgb, currentColor 16%, transparent); overflow: hidden; }
.bars .fill { display: block; height: 100%; border-radius: 4px; background: currentColor; }
.bars .v { font-variant-numeric: tabular-nums; }
.links { display: flex; gap: 14px; font-size: 13px; }
.links a { color: var(--accent); font-weight: 700; }
details summary { cursor: pointer; font-size: 14px; color: var(--muted); }
details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); }
.sample { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<!-- 음식 일러스트 (직접 그린 단순 도형) -->
</head>

// ── 받침에 따라 조사 고르기 ─────────────────────────────────
// 한글: 마지막 글자에 받침이 있는지 / 숫자: 읽는 소리 / 영어: 발음 규칙으로 추정
const DIGIT_BATCHIM = new Set("013678");          // 영 일 삼 육 칠 팔
const LETTER_BATCHIM = new Set("LMNR");           // 엘 엠 엔 알
function hasBatchim(word) {
  const w = String(word).trim().replace(/[^0-9A-Za-z가-힣ㄱ-ㅎ]+$/u, "");
  if (!w) return false;
  const ch = w.slice(-1), code = ch.charCodeAt(0);
  if (code >= 0xAC00 && code <= 0xD7A3) return (code - 0xAC00) % 28 !== 0;
  if (code >= 0x3131 && code <= 0x314E) return true;
  if (/[0-9]/.test(ch)) return DIGIT_BATCHIM.has(ch);
  if (/[A-Z]/.test(ch) && !/[a-z]/.test(w)) return LETTER_BATCHIM.has(ch);  // 약자: JK, A, BTS
  const lw = w.toLowerCase();
  if (/(ng|ck|[lmn])$/.test(lw)) return true;                   // Tom, Paul, John, Jack, Young
  if (/[aeiou]([bkpt])\1?$/.test(lw)) return true;               // Bob, Pat, Matt
  return false;                                                  // Kate, Mike, Peter
}
// josa("민지", "이에요/예요") → "민지예요",  josa("서연", "이/가") → "서연이"
function josa(word, pair) {
  const [withB, withoutB] = pair.split("/");
  return word + (hasBatchim(word) ? withB : withoutB);
}

// ── 점수 알고리즘 (meal_score.py v0.1 포팅) ─────────────────
const ROUND_SCORE = { 1: 1.0, 2: 0.85, 4: 0.7, 8: 0.55, 16: 0.4, 32: 0.25 };
const DISLIKE_PENALTY = 0.25, BUDGET_PENALTY_CAP = 0.4, TAG_SHRINK = 0.7;
const LIKE_TH = 0.7, UNHAPPY_TH = 0.35, CONF_W = 0.15, MIN_SHOW = 50;
const MODES = { "평화": { alpha: 0.4, price_w: 0 }, "만족도": { alpha: 0.8, price_w: 0 }, "가성비": { alpha: 0.6, price_w: 0.25 } };
const MODE_HINT = { "평화": "한 명이라도 불만인 메뉴는 뒤로", "만족도": "다 같이 제일 맛있게", "가성비": "싸고 무난하게" };
const CONTEXT_TAGS = new Set(["술자리", "혼밥", "단체", "밥", "면", "빵"]);

const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const clamp01 = x => Math.max(0, Math.min(1, x));

function tagAffinity(p) {
  const s = {}, c = {};
  for (const [name, v] of Object.entries(p.pref)) {
    for (const t of M[name].tags) {
      if (CONTEXT_TAGS.has(t)) continue;
      s[t] = (s[t] || 0) + v; c[t] = (c[t] || 0) + 1;
    }
  }
  const a = {}; for (const t in s) a[t] = s[t] / c[t]; return a;
}
function personScore(p, m, aff) {
  if (m.tags.some(t => p.hardNo.has(t))) return null;
  let base;
  if (m.name in p.pref) base = p.pref[m.name];
  else {
    const v = m.tags.filter(t => !CONTEXT_TAGS.has(t) && t in aff).map(t => aff[t]);
    base = v.length ? 0.5 + TAG_SHRINK * (avg(v) - 0.5) : 0.5;
  }
  base -= DISLIKE_PENALTY * m.tags.filter(t => p.dislikes.has(t)).length;
  if (p.budget && m.price > p.budget) base -= Math.min(BUDGET_PENALTY_CAP, (m.price - p.budget) / p.budget);
  return clamp01(base);
}
function recommend(people, mode, top = 3) {
  const cfg = MODES[mode];
  const affs = people.map(tagAffinity);
  const prices = MENUS.map(m => m.price), pmin = Math.min(...prices), pmax = Math.max(...prices);
  const ranked = [], excluded = [];
  for (const m of MENUS) {
    const scores = people.map((p, i) => personScore(p, m, affs[i]));
    const blockers = people.filter((p, i) => scores[i] === null).map(p => p.name);
    if (blockers.length) { excluded.push({ name: m.name, blockers }); continue; }
    const mean = avg(scores), low = Math.min(...scores);
    let g = cfg.alpha * mean + (1 - cfg.alpha) * low;
    if (cfg.price_w) {
      const cheap = pmax > pmin ? 1 - (m.price - pmin) / (pmax - pmin) : 1;
      g = (1 - cfg.price_w) * g + cfg.price_w * cheap;
    }
    const direct = people.filter(p => m.name in p.pref).length;
    g *= (1 - CONF_W) + CONF_W * direct / people.length;

    const likers = scores.filter(s => s >= LIKE_TH).length;
    const unhappy = people.filter((p, i) => scores[i] < UNHAPPY_TH).map(p => p.name);
    let reason = direct ? `${likers}명 선호` : "취향 기반 추정";
    reason += unhappy.length ? `, 불만 ${unhappy.length}명(${unhappy.join(", ")})` : ", 불만 0명";
    const notes = people.filter(p => m.tags.some(t => p.dislikes.has(t)))
      .map(p => `${p.name} ${m.tags.filter(t => p.dislikes.has(t)).join("/")} 비선호`);
    if (notes.length) reason += ` (${notes.join("; ")})`;
    if (people.every(p => !p.budget || m.price <= p.budget)) reason += ", 전원 예산 OK";

    const score = Math.round(g * 100);
    if (score >= MIN_SHOW) ranked.push({ score, name: m.name, reason, scores, price: m.price });
  }
  ranked.sort((a, b) => b.score - a.score || a.price - b.price);
  return { top: ranked.slice(0, top), excluded };
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeBracket() {
  const pools = CUISINES.map(c => shuffle(MENUS.filter(m => m.tags[0] === c).map(m => m.name)));
  const out = [];
  for (let k = 0; out.length < 16; k++) {
    for (const pool of shuffle(pools)) { if (pool[k] && out.length < 16) out.push(pool[k]); }
    if (k > 20) break;
  }
  return shuffle(out);
}
const ROUND_LABEL = { 16: "16강", 8: "8강", 4: "준결승", 2: "결승" };

// ── 배경음악: 파일 없이 브라우저에서 바로 만드는 잔잔한 루프 ─────
const BGM = {
  ctx: null, bus: null, master: null, playing: false, timer: null, nextT: 0, step: 0, started: false,
  on: (() => { try { return localStorage.getItem("nyampick-bgm") !== "off"; } catch (e) { return true; } })(),
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0;
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
    const dl = c.createDelay(); dl.delayTime.value = 0.42;
    const fb = c.createGain(); fb.gain.value = 0.3;
    this.bus = c.createGain();
    this.bus.connect(lp); this.bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(lp);
    lp.connect(this.master); this.master.connect(c.destination);
    return true;
  },
  start() {
    this.started = true; syncBgmButton();
    if (!this.on || !this.init()) return;
    this.ctx.resume();
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(0.55, t, 0.9);
    if (this.playing) return;
    this.playing = true; this.nextT = t + 0.1; this.step = 0;
    clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 100);
  },
  stop(fade = 1.2) {
    if (!this.ctx || !this.playing) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(0, t, fade / 3);
    this.playing = false;
    setTimeout(() => { if (!this.playing) clearInterval(this.timer); }, fade * 1000 + 300);
  },
  tick() {
    const spb = 60 / 74 / 2;                                   // 8분음표, 74bpm
    while (this.nextT < this.ctx.currentTime + 0.4) { this.play(this.step, this.nextT, spb); this.nextT += spb; this.step++; }
  },
  play(s, t, spb) {
    const bar = Math.floor(s / 8) % 4, pos = s % 8;
    const chords = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]]; // Fmaj7 Em7 Dm7 Cmaj7
    const mel = [[76, 0, 72, 0, 74, 0, 69, 0], [71, 0, 67, 0, 72, 74, 0, 0], [69, 0, 72, 0, 77, 0, 76, 0], [74, 0, 72, 0, 67, 0, 0, 0]];
    if (pos === 0) {
      chords[bar].forEach(n => this.note(n, t, spb * 8, "sine", 0.045, 0.8));
      this.note(chords[bar][0] - 12, t, spb * 8, "triangle", 0.06, 0.05);
    }
    if (pos === 4) this.note(chords[bar][2] - 12, t, spb * 4, "triangle", 0.035, 0.05);
    const m = mel[bar][pos];
    if (m) this.note(m, t, spb * 2.2, "triangle", 0.04, 0.005);
  },
  note(midi, t, dur, type, vol, att) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + att + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + dur + 0.05);
  },
  chime() {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + 0.05;
    this.master.gain.cancelScheduledValues(t); this.master.gain.setValueAtTime(0.55, t);
    [[79, 0], [84, 0.14], [88, 0.28]].forEach(([n, d]) => this.note(n, t + d, 1.4, "triangle", 0.06, 0.005));
    this.master.gain.setTargetAtTime(0, t + 1.6, 0.4);
  },
  toggle() {
    this.on = !this.on;
    try { localStorage.setItem("nyampick-bgm", this.on ? "on" : "off"); } catch (e) {}
    if (this.on && ["handoff", "prefs", "wc"].includes(S.screen)) this.start(); else this.stop(0.6);
    syncBgmButton();
  }
};
const bgmBtn = document.getElementById("bgm");
function syncBgmButton() {
  bgmBtn.hidden = !BGM.started;
  bgmBtn.setAttribute("aria-pressed", String(BGM.on));
  bgmBtn.setAttribute("aria-label", BGM.on ? "배경음악 끄기" : "배경음악 켜기");
}
bgmBtn.addEventListener("click", () => BGM.toggle());
document.addEventListener("visibilitychange", () => {
  if (!BGM.ctx) return;
  if (document.hidden) BGM.ctx.suspend(); else if (BGM.playing) BGM.ctx.resume();
});

// 4) 월드컵
function startWC() {
  S.wc = { round: S.bracket.slice(), next: [], i: 0, size: 16, ranks: {}, done: 0 };
  autoAdvance();
}
function blocked(name) { return M[name].tags.some(t => S.people[S.cur].hardNo.has(t)); }
function resolve(winIdx) {
  const w = S.wc, a = w.round[w.i], b = w.round[w.i + 1];
  const win = winIdx === 0 ? a : b, lose = winIdx === 0 ? b : a;
  w.ranks[lose] = w.size; w.next.push(win); w.i += 2; w.done++;
  if (w.i >= w.round.length) {
    if (w.next.length === 1) { w.ranks[w.next[0]] = 1; return finishPerson(); }
    w.round = w.next; w.next = []; w.i = 0; w.size = w.round.length;
  }
  return autoAdvance();
}
function autoAdvance() {
  // 못 먹는 메뉴가 붙은 대결은 자동 처리
  const w = S.wc, a = w.round[w.i], b = w.round[w.i + 1];
  const ba = blocked(a), bb = blocked(b);
  if (ba && !bb) return resolve(1);
  if (bb && !ba) return resolve(0);
  if (ba && bb) return resolve(0);
  S.screen = "wc";
}
function finishPerson() {
  const p = S.people[S.cur];
  p.pref = Object.fromEntries(Object.entries(S.wc.ranks).map(([n, r]) => [n, ROUND_SCORE[r] ?? 0.2]));
  S.cur++;
  S.screen = S.cur < S.people.length ? "handoff" : "result";
}
function card(name, idx) {
  const m = M[name], c = cuisineOf(m);
  const tags = m.tags.filter(t => !CONTEXT_TAGS.has(t) && t !== c).slice(0, 2).map(t => `<span class="tag">${t}</span>`).join("");
  return `<button class="pick" data-act="pick" data-i="${idx}">
    <span class="art c-${c}">${icon(ART[c])}</span>
    <span class="txt"><span class="name">${esc(name)}</span><span class="meta"><span class="tag">${c}</span>${tags}<span class="price">${won(m.price)}</span></span></span>
  </button>`;
}
function viewWC() {
  const w = S.wc, p = S.people[S.cur];
  return `
    ${progress()}
    <div class="wc-head"><span class="round">${ROUND_LABEL[w.size]}</span><span class="count">${esc(p.name)} · ${w.i / 2 + 1}/${w.round.length / 2}</span></div>
    <div class="duel">${card(w.round[w.i], 0)}<div class="vs">VS</div>${card(w.round[w.i + 1], 1)}</div>
    <p class="hint">더 끌리는 쪽을 눌러주세요</p>`;
}

// 5) 결과
function viewResult() {

  const find = n => `<div class="links"><a href="https://map.naver.com/p/search/${encodeURIComponent(n)}" target="_blank" rel="noopener">네이버지도에서 찾기</a><a href="https://map.kakao.com/?q=${encodeURIComponent(n)}" target="_blank" rel="noopener">카카오맵</a></div>`;
  let body;

    body = `<div class="panel empty">모두가 무난한 메뉴를 못 찾았어요.<br>결정 방식을 '만족도'로 바꿔보세요.</div>`;
  } else {

      </div>

        <div class="alt">

          <p class="hint">${esc(r.reason)}</p>

  }
  const byPerson = {};
  for (const e of excluded) for (const b of e.blockers) (byPerson[b] ||= []).push(e.name);
  const exList = Object.entries(byPerson).map(([n, list]) => `<li>${esc(josa(n, "이/가"))} 못 먹는 메뉴: ${list.map(esc).join(", ")}</li>`).join("");

    ${body}
    ${exList ? `<details><summary>제외된 메뉴 ${excluded.length}개</summary><ul>${exList}</ul></details>` : ""}
    <button class="btn" data-act="again">같은 멤버로 다시</button>
    <button class="btn ghost" data-act="reset">처음으로</button>`;
}

// ── 이벤트 ───────────────────────────────────────────────────
function person(name) { return { name, pref: {}, hardNo: new Set(), dislikes: new Set(), budget: null }; }
function begin(names) {
  S.people = names.map(person); S.cur = 0; S.bracket = makeBracket(); S.demo = false; S.screen = "handoff";
}
app.addEventListener("input", e => {
  const i = e.target.dataset.name; if (i !== undefined) S.names[+i] = e.target.value;
});
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, p = S.people[S.cur];
  const before = S.screen;
  switch (act) {
    case "add": S.names.push(""); break;
    case "del": S.names.splice(+el.dataset.i, 1); break;
    case "mode": S.mode = el.dataset.mode; break;
    case "start": {
      const seen = {};
      const names = S.names.map(n => n.trim()).filter(Boolean).map(n => (seen[n] = (seen[n] || 0) + 1) > 1 ? `${n}${seen[n]}` : n);
      if (names.length < 2) return;
      S.names = names; begin(names); break;
    }
    case "go-prefs": S.screen = "prefs"; break;
    case "hard": { const t = el.dataset.t; p.hardNo.has(t) ? p.hardNo.delete(t) : (p.hardNo.add(t), p.dislikes.delete(t)); break; }
    case "meh": { const t = el.dataset.t; p.dislikes.has(t) ? p.dislikes.delete(t) : p.dislikes.add(t); break; }
    case "budget": p.budget = el.dataset.v ? +el.dataset.v : null; break;
    case "go-wc": BGM.start(); startWC(); break;
    case "pick": resolve(+el.dataset.i); break;
    case "again": begin(S.people.map(x => x.name)); break;
    case "reset": BGM.stop(0.6); S.screen = "setup"; S.demo = false; break;
    case "demo": loadDemo(); break;
  }
  if (S.screen === "result" && before !== "result") { BGM.stop(1.2); if (!S.demo) { BGM.chime(); track("menu-decided", "메뉴 결정 완료"); } }
  render();
});

// PPT 예시 4명 (meal_score.py 데모와 같은 입력)
function loadDemo() {
  const BR = ["돈까스", "초밥", "라멘", "국밥", "삼겹살", "파스타", "떡볶이", "치킨", "김밥", "짜장면", "마라탕", "샐러드", "피자", "쌀국수", "제육볶음", "회"];
  const wc = (c, f, semi, q) => { const r = Object.fromEntries(BR.map(m => [m, 16])); q.forEach(m => r[m] = 8); semi.forEach(m => r[m] = 4); r[f] = 2; r[c] = 1; return Object.fromEntries(Object.entries(r).map(([n, v]) => [n, ROUND_SCORE[v]])); };
  const mk = (name, pref, o = {}) => ({ name, pref, hardNo: new Set(o.hard || []), dislikes: new Set(o.meh || []), budget: o.budget ?? null });
  S.people = [
    mk("A", wc("초밥", "돈까스", ["라멘", "회"], ["쌀국수", "파스타", "짜장면", "피자"]), { hard: ["매운맛"] }),
    mk("B", wc("국밥", "삼겹살", ["돈까스", "제육볶음"], ["치킨", "짜장면", "김밥", "라멘"]), { meh: ["채소위주"] }),
    mk("C", wc("파스타", "돈까스", ["피자", "샐러드"], ["초밥", "쌀국수", "치킨", "김밥"]), { meh: ["국물"] }),
    mk("D", wc("떡볶이", "치킨", ["돈까스", "김밥"], ["짜장면", "제육볶음", "마라탕", "피자"]), { budget: 13000 }),
  ];
  S.cur = S.people.length; S.demo = true; S.screen = "result";
}

// 배경 스티커 배치 (화면 가장자리 위주)
(function decorate() {
  const spots = [["f-donut", 4, 10, -12], ["f-sushi", 82, 16, 10], ["f-latte", 88, 46, -8], ["f-pizza", 2, 52, 14],

    `<svg class="ic" style="left:calc(${x}% - 32px);top:calc(${y}% - 32px);transform:rotate(${r}deg)"><use href="#${id}"/></svg>`).join("");
})();

// 스플래시 → 본 화면
render();
(function splash() {
  const el = document.getElementById("splash");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hide = () => { el.classList.add("hide"); setTimeout(() => el.remove(), 600); };
  const t = setTimeout(hide, reduce ? 600 : 1900);
  el.addEventListener("click", () => { clearTimeout(t); hide(); }, { once: true });
})();
</script>

</body>
</html>
